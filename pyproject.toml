[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwarden"
version = "0.1.0"
description = "A reliable, secure, observable and measured runtime for agentic AI systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.6,<3",
  "pymongo>=4.13,<5",
  "httpx>=0.28,<1",
  "sqlglot>=26",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
agentwarden = "agentwarden.cli:main"

[tool.setuptools.packages.find]
include = ["agentwarden*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "mongo: needs a reachable MongoDB (skipped locally if absent; fails in CI via AW_REQUIRE_MONGO=1)",
  "ollama: needs a running Ollama with the configured model (manual live smoke test)",
]
addopts = "-m 'not ollama'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM105", "UP047"]
