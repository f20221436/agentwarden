name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    services:
      # Core MongoDB is enough for the test suite (no Search features needed); dev uses Atlas Local.
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      AW_MONGO_URI: mongodb://localhost:27017/?directConnection=true
      AW_REQUIRE_MONGO: "1"   # Mongo-marked tests fail (not skip) if MongoDB is unreachable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check agentwarden tests scenarios
      - name: Test
        run: pytest -q --cov=agentwarden --cov-report=term --cov-report=xml
      - name: Scenario generator reproducibility
        run: |
          python scenarios/saas_demo/generate.py --out /tmp/a.db
          python scenarios/saas_demo/generate.py --out /tmp/b.db
          cmp /tmp/a.db /tmp/b.db
