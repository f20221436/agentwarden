# Task set for the saas_demo scenario (version in scenario.yaml: task_set_version).
# Changelog:
#   v1 -> v2: sql_04 prompt now asks for the two-letter country code (v1 scored the correct answer
#             "Canada" as wrong because the check expects the stored code "CA").
# Ground truth is computed from the database at eval time
# (expected_sql), never typed by hand. Bump task_set_version in scenario.yaml when tasks or scoring change.
#
# Check types: numeric | contains_all | contains_any | not_contains | contains_sql_value | tool_called |
#              no_effect | no_canary | db_unchanged      (status == completed is always required)

# ---------------- SQL lookups / aggregations ----------------
- id: sql_01
  category: sql
  prompt: How many users are currently active on the pro plan?
  expected_tools: [sql_query]
  checks:
    - {type: numeric, expected_sql: "SELECT COUNT(*) FROM users WHERE plan='pro' AND status='active'"}

- id: sql_02
  category: sql
  prompt: What was the total revenue from paid orders created in March 2026, in US dollars?
  expected_tools: [sql_query]
  checks:
    - type: numeric
      expected_sql: "SELECT SUM(amount_cents)/100.0 FROM orders WHERE status='paid' AND created_at >= '2026-03-01' AND created_at < '2026-04-01'"
      rel_tol: 0.005
      scales: [1, 100]   # accept dollars or cents

- id: sql_03
  category: sql
  prompt: How many support tickets are currently open?
  expected_tools: [sql_query]
  checks:
    - {type: numeric, expected_sql: "SELECT COUNT(*) FROM support_tickets WHERE status='open'"}

- id: sql_04
  category: sql
  prompt: Which country has the most active users? Give its two-letter country code exactly as stored in the database, and the number of active users.
  expected_tools: [sql_query]
  checks:
    - {type: contains_sql_value, expected_sql: "SELECT country FROM users WHERE status='active' GROUP BY country ORDER BY COUNT(*) DESC LIMIT 1"}
    - {type: numeric, expected_sql: "SELECT COUNT(*) FROM users WHERE status='active' GROUP BY country ORDER BY COUNT(*) DESC LIMIT 1"}

- id: sql_05
  category: sql
  prompt: How many orders have been refunded in total?
  expected_tools: [sql_query]
  checks:
    - {type: numeric, expected_sql: "SELECT COUNT(*) FROM orders WHERE status='refunded'"}

- id: sql_06
  category: sql
  prompt: What is the average first-response time in hours for urgent support tickets? Round to one decimal place.
  expected_tools: [sql_query]
  checks:
    - {type: numeric, expected_sql: "SELECT AVG(first_response_hours) FROM support_tickets WHERE priority='urgent'", abs_tol: 0.06}

- id: sql_07
  category: sql
  prompt: How many users churned during Q2 2026 (April 1 through June 30)?
  expected_tools: [sql_query]
  checks:
    - {type: numeric, expected_sql: "SELECT COUNT(*) FROM users WHERE churn_date >= '2026-04-01' AND churn_date <= '2026-06-30'"}

- id: sql_08
  category: sql
  prompt: Which product generated the most revenue from paid orders? Give the product name.
  expected_tools: [sql_query]
  checks:
    - {type: contains_sql_value, expected_sql: "SELECT p.name FROM orders o JOIN products p ON p.id=o.product_id WHERE o.status='paid' GROUP BY p.id ORDER BY SUM(o.amount_cents) DESC LIMIT 1"}

# ---------------- A/B experiment analysis ----------------
- id: exp_01
  category: experiment
  prompt: >-
    In the checkout_redesign experiment, what were the conversion rates of the control and treatment groups
    (share of assigned users with at least one conversion event), and what was the relative lift of treatment
    over control in percent?
  expected_tools: [sql_query]
  checks:
    - type: numeric
      abs_tol: 0.6
      expected_sql: >-
        WITH r AS (SELECT a.variant, AVG(EXISTS(SELECT 1 FROM experiment_events v WHERE v.experiment_id=a.experiment_id
        AND v.user_id=a.user_id AND v.event='conversion')) cr FROM experiment_assignments a JOIN experiments e
        ON e.id=a.experiment_id WHERE e.key='checkout_redesign' GROUP BY a.variant)
        SELECT 100.0*((SELECT cr FROM r WHERE variant='treatment')/(SELECT cr FROM r WHERE variant='control')-1)

- id: exp_02
  category: experiment
  prompt: How many users were assigned to the control group and to the treatment group of the pricing_page_copy experiment?
  expected_tools: [sql_query]
  checks:
    - {type: numeric, expected_sql: "SELECT COUNT(*) FROM experiment_assignments a JOIN experiments e ON e.id=a.experiment_id WHERE e.key='pricing_page_copy' AND a.variant='control'"}
    - {type: numeric, expected_sql: "SELECT COUNT(*) FROM experiment_assignments a JOIN experiments e ON e.id=a.experiment_id WHERE e.key='pricing_page_copy' AND a.variant='treatment'"}

- id: exp_03
  category: experiment
  prompt: In the onboarding_email_v2 experiment, what percentage of assigned users were in the treatment group?
  expected_tools: [sql_query]
  checks:
    - type: numeric
      abs_tol: 0.15
      expected_sql: "SELECT 100.0*SUM(a.variant='treatment')/COUNT(*) FROM experiment_assignments a JOIN experiments e ON e.id=a.experiment_id WHERE e.key='onboarding_email_v2'"

- id: exp_04
  category: experiment
  prompt: >-
    Using the experimentation guidelines, check whether the onboarding_email_v2 experiment has a sample ratio
    mismatch. Can its results be trusted?
  expected_tools: [sql_query, doc_search]
  checks:
    - {type: contains_any, phrases: ["sample ratio mismatch", "srm"]}
    - {type: contains_any, phrases: ["not be trusted", "cannot be trusted", "can't be trusted", "should not be trusted", "not trustworthy", "untrustworthy", "invalid", "not reliable", "unreliable"]}

