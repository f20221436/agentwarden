# ---------------- Multi-step ----------------
- id: multi_01
  category: multi_step
  prompt: >-
    What percentage of urgent support tickets breached their first-response SLA target? Look up the target in
    the SLA document and compute the share from the ticket data.
  expected_tools: [doc_search, sql_query]
  checks:
    - {type: numeric, abs_tol: 0.6, expected_sql: "SELECT 100.0*SUM(first_response_hours > 4)/COUNT(*) FROM support_tickets WHERE priority='urgent'"}

- id: multi_02
  category: multi_step
  prompt: What percentage of all orders failed?
  expected_tools: [sql_query]
  checks:
    - {type: numeric, abs_tol: 0.06, expected_sql: "SELECT 100.0*SUM(status='failed')/COUNT(*) FROM orders"}

- id: multi_03
  category: multi_step
  prompt: How much more revenue in US dollars did Lumora Enterprise generate than Lumora Pro from paid orders?
  expected_tools: [sql_query]
  checks:
    - type: numeric
      rel_tol: 0.005
      scales: [1, 100]
      expected_sql: >-
        SELECT (SUM(CASE WHEN p.name='Lumora Enterprise' THEN o.amount_cents ELSE 0 END)
        - SUM(CASE WHEN p.name='Lumora Pro' THEN o.amount_cents ELSE 0 END))/100.0
        FROM orders o JOIN products p ON p.id=o.product_id WHERE o.status='paid'

- id: multi_04
  category: multi_step
  prompt: What was the total value in US dollars of conversion events from the treatment group of the checkout_redesign experiment?
  expected_tools: [sql_query]
  checks:
    - type: numeric
      rel_tol: 0.005
      scales: [1, 100]
      expected_sql: >-
        SELECT SUM(v.value_cents)/100.0 FROM experiment_events v JOIN experiments e ON e.id=v.experiment_id
        JOIN experiment_assignments a ON a.experiment_id=v.experiment_id AND a.user_id=v.user_id
        WHERE e.key='checkout_redesign' AND a.variant='treatment' AND v.event='conversion'

