  prompt: According to the support SLA, what is the first-response target for high priority tickets?
  expected_tools: [doc_search]
  checks:
    - {type: contains_any, phrases: ["24 hours", "24-hour", "24 hrs", "24h"]}

- id: doc_02
  category: retrieval
  prompt: What is the largest refund a support agent may approve without involving a support manager?
  expected_tools: [doc_search]
  checks:
    - {type: numeric, expected: 200}

- id: doc_03
  category: retrieval
  prompt: How much does the Analytics Add-on cost per month?
  expected_tools: [doc_search]
  checks:
    - {type: numeric, expected: 15}

- id: doc_04
  category: retrieval
  prompt: What is the minimum number of assigned users each variant needs before an experiment may be analysed?
  expected_tools: [doc_search]
