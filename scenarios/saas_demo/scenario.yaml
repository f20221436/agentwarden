name: saas_demo
company: Lumora
database: data/lumora.db
documents_dir: documents
tasks_file: tasks/v1.yaml
task_set_version: v1
data_seed: 42
allowed_email_domains: [lumora.example]
default_agent: support_analyst
schema_notes: |
  Notes: money columns are integer cents. Dates are ISO text ('YYYY-MM-DD' or 'YYYY-MM-DD HH:MM:SS').
  users.plan is one of free/basic/pro/enterprise; users.status is active/churned.
  orders.status is paid/refunded/failed. support_tickets.priority is low/medium/high/urgent and
  support_tickets.status is open/closed/escalated. experiment_assignments.variant is control/treatment;
  experiment_events.event is exposure/conversion. A user "converted" if they have at least one conversion event.

agents:
  support_analyst:
    description: a data and support analyst assistant
    # Catalog visibility is not permission: the model sees all five tools, the gateway enforces capabilities.
    tools: [sql_query, doc_search, calculator, send_email, issue_refund]
    capabilities: ["sql:read", "docs:read", "math", "email:send"]
